[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xi-lab"
version = "0.1.0"
description = "Context-aware cricket team selection engine"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10",
    "pandas>=2.2",
    "pyarrow>=15",
    "pandera>=0.18",
    "lightgbm>=4.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pulp>=2.8",
    "shap>=0.45",
    "mlflow>=2.12",
    "dvc>=3.49",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tqdm>=4.66",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "optuna>=3.6",
    "pymc>=5.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "backend*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ml", "backend"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["ml/notebooks", "data", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ml", "backend"]
omit = ["*/notebooks/*", "*/tests/*"]
