stages:
  download:
    cmd: python ml/ingest/download.py --incremental
    deps:
      - ml/ingest/download.py
    outs:
      - data/raw/cricsheet

  parse_t20_male:
    cmd: python ml/ingest/parse.py --format t20 --gender male
    deps:
      - ml/ingest/parse.py
      - ml/ingest/schemas.py
      - ml/ingest/normalize.py
      - data/raw/cricsheet/t20s
      - data/reference/venue_map.csv
      - data/reference/league_map.csv
    outs:
      - data/interim/t20/male

  parse_t20_female:
    cmd: python ml/ingest/parse.py --format t20 --gender female
    deps:
      - ml/ingest/parse.py
      - ml/ingest/schemas.py
      - ml/ingest/normalize.py
      - data/raw/cricsheet/t20s
      - data/reference/venue_map.csv
      - data/reference/league_map.csv
    outs:
      - data/interim/t20/female

  parse_odi_male:
    cmd: python ml/ingest/parse.py --format odi --gender male
    deps:
      - ml/ingest/parse.py
      - ml/ingest/schemas.py
      - ml/ingest/normalize.py
      - data/raw/cricsheet/odis
      - data/reference/venue_map.csv
      - data/reference/league_map.csv
    outs:
      - data/interim/odi/male

  parse_odi_female:
    cmd: python ml/ingest/parse.py --format odi --gender female
    deps:
      - ml/ingest/parse.py
      - ml/ingest/schemas.py
      - ml/ingest/normalize.py
      - data/raw/cricsheet/odis
      - data/reference/venue_map.csv
      - data/reference/league_map.csv
    outs:
      - data/interim/odi/female

  parse_test_male:
    cmd: python ml/ingest/parse.py --format test --gender male
    deps:
      - ml/ingest/parse.py
      - ml/ingest/schemas.py
      - ml/ingest/normalize.py
      - data/raw/cricsheet/tests
      - data/reference/venue_map.csv
      - data/reference/league_map.csv
    outs:
      - data/interim/test/male

  parse_test_female:
    cmd: python ml/ingest/parse.py --format test --gender female
    deps:
      - ml/ingest/parse.py
      - ml/ingest/schemas.py
      - ml/ingest/normalize.py
      - data/raw/cricsheet/tests
      - data/reference/venue_map.csv
      - data/reference/league_map.csv
    outs:
      - data/interim/test/female

  features:
    cmd: python ml/features/snapshots.py
    deps:
      - ml/features/snapshots.py
      - data/interim/t20
      - data/interim/odi
      - data/interim/test
      - data/reference/player_meta.csv
      - params.yaml
    params:
      - splits
      - ability
    outs:
      - data/processed/snapshots

  train_ability:
    cmd: >-
      python ml/models/ability/train.py --format t20 --gender male &&
      python ml/models/ability/train.py --format odi --gender male &&
      python ml/models/ability/train.py --format test --gender male &&
      python ml/models/ability/train.py --format t20 --gender female &&
      python ml/models/ability/train.py --format odi --gender female &&
      python ml/models/ability/train.py --format test --gender female
    deps:
      - ml/models/ability/train.py
      - data/processed/snapshots
      - data/reference/player_meta.csv
      - params.yaml
    params:
      - ability
      - splits
    outs:
      - data/processed/models/ability
    metrics:
      - data/processed/metrics/ability.json

  train_ball:
    cmd: >-
      python ml/models/ball/train.py --format t20 --gender male &&
      python ml/models/ball/train.py --format odi --gender male &&
      python ml/models/ball/train.py --format t20 --gender female &&
      python ml/models/ball/train.py --format odi --gender female
    deps:
      - ml/models/ball/train.py
      - data/processed/snapshots
      - data/interim/t20
      - data/interim/odi
      - params.yaml
    params:
      - ball_model
      - splits
    outs:
      - data/processed/models/ball
    metrics:
      - data/processed/metrics/ball.json

  train_policies:
    cmd: >-
      python ml/models/policies/train.py --format t20 --gender male &&
      python ml/models/policies/train.py --format odi --gender male &&
      python ml/models/policies/train.py --format t20 --gender female &&
      python ml/models/policies/train.py --format odi --gender female
    deps:
      - ml/models/policies/train.py
      - data/interim/t20
      - data/interim/odi
      - params.yaml
    params:
      - splits
    outs:
      - data/processed/models/policies
    metrics:
      - data/processed/metrics/policies.json

  backtest:
    cmd: >-
      python ml/evaluate/backtest.py --format t20 --gender male &&
      python ml/evaluate/backtest.py --format odi --gender male &&
      python ml/evaluate/backtest.py --format t20 --gender female &&
      python ml/evaluate/backtest.py --format odi --gender female
    deps:
      - ml/evaluate/backtest.py
      - data/processed/models/ball
      - data/processed/models/ability
      - data/processed/models/policies
      - data/interim/t20
      - params.yaml
    params:
      - splits
      - simulator
    metrics:
      - data/processed/metrics/backtest.json
