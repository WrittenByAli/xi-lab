# ── Splits ────────────────────────────────────────────────────────────────────
splits:
  train_end: "2022-12-31"
  val_start: "2023-01-01"
  val_end:   "2023-12-31"
  test_start: "2024-01-01"

# ── Ability model ─────────────────────────────────────────────────────────────
ability:
  rating_half_life_days: 730      # ~2 years; tune on 2023 val set
  min_balls_for_rating: 30        # below this, use prior only
  shrinkage_groups: ["role", "format"]

# ── Ball model ────────────────────────────────────────────────────────────────
ball_model:
  n_estimators: 1000
  learning_rate: 0.05
  num_leaves: 127
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  seed: 42
  early_stopping_rounds: 50
  outcome_classes: ["dot", "1", "2", "3", "4", "6", "wicket", "wide", "noball"]

# ── Simulator ─────────────────────────────────────────────────────────────────
simulator:
  n_sims_default: 10000
  n_posterior_draws: 20           # K rating samples per scenario
  crn_seed: 0                     # common random numbers seed
  kl_bucket_threshold: 0.01       # max KL from bucketing approximation

# ── Optimizer ────────────────────────────────────────────────────────────────
optimizer:
  ilp_n_candidates: 30
  racing_initial_sims: 1000
  racing_rounds: 4                # halve field each round → final 2 at ~8k sims
  n_opponent_draws: 5
  tie_set_alpha: 0.05             # CI level for tie-set inclusion

# ── Formats ───────────────────────────────────────────────────────────────────
formats:
  t20:
    overs: 20
    max_bowler_overs: 4
    phases: [[0,5], [6,15], [16,19]]     # powerplay / middle / death
    phase_names: ["powerplay", "middle", "death"]
  odi:
    overs: 50
    max_bowler_overs: 10
    phases: [[0,9], [10,29], [30,39], [40,49]]
    phase_names: ["powerplay", "consolidation", "transition", "death"]
  test:
    overs: 90
    max_bowler_overs: 90
    phases: [[0,10], [11,60], [61,89]]
    phase_names: ["new_ball", "middle", "old_ball"]

# ── Leakage tests ─────────────────────────────────────────────────────────────
leakage:
  n_truncation_samples: 50
  poison_date: "2023-06-01"
  poison_value: 99               # artificial run value injected after poison_date
